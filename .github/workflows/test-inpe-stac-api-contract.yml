name: Test INPE STAC API contract

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  check-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884

      - name: Run code to Test INPE STAC API contract
        run: |
          uvx --from cbers4asat python -c \
          'from cbers4asat import Cbers4aAPI;\
          api = Cbers4aAPI();\
          p = api.query_by_id(\
            scene_id="CBERS4A_WPM22912420210830",\
            collection="CBERS4A_WPM_L4_DN");\
          print(p)'

          uvx --from cbers4asat python -c \
          'from cbers4asat import Cbers4aAPI;\
          from datetime import date;\
          api = Cbers4aAPI();\
          p = api.query(\
            location=(229, 124),\
            initial_date=date(2023, 8, 25),\
            end_date=date.today(),\
            cloud=100,\
            limit=1,\
            collections=["CBERS4A_WPM_L4_DN"]);\
          print(p)'
